name: Push reminders

# Отправитель редких важных напоминаний (ЭТАП 3, решение владельца 2026-10-01):
# живёт в ПУБЛИЧНОМ репозитории — платные минуты приватного хранилища не тратятся.
# Раз в 30 минут: ступени сроков, сработавшие сегодня (Europe/Moscow), уходят Web
# Push на подписки устройств; каждое напоминание — один раз (маркеры push-sent).
# Ручной Run workflow по умолчанию делает ОБЫЧНЫЙ цикл (сроки, дела, дайджест покупок):
# именно это нужно владельцу для проверки «почему не пришло уведомление». Режим
# «test» — отдельное проверочное сообщение без сроков и маркеров; выбирается явно.
# Main этим патчем не меняется.
on:
  schedule:
    # 0.6.0: каждые 5 минут — минимальный разрешённый интервал GitHub. Замер 03–05.10.2026
    # показал, что при `*/30` цикл фактически запускался 4–6 раз в СУТКИ, поэтому «точное
    # время» недостижимо: чем чаще просим, тем больше шансов попасть в нужный час.
    # Дубли исключены маркерами (напоминание уходит один раз), дайджест покупок сам
    # держит паузу 30 минут, в публичном репозитории минуты Actions бесплатны.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'reminders — обычный цикл (напоминания, дела, дайджест), test — только проверочный push'
        type: choice
        options:
          - reminders
          - test
        default: reminders

concurrency:
  group: push-sender
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Лента публикуется в ветку `feed` этого же публичного репозитория встроенным токеном:
    # отдельные секреты и права владельца не нужны. Пуш сделан GITHUB_TOKEN, поэтому
    # другие workflow (CI, Pages) на него не запускаются.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Напоминания по расписанию или ручная проверка push
        env:
          FAMILY_REPO_TOKEN: ${{ secrets.FAMILY_REPO_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUBLIC_REPO_TOKEN: ${{ github.token }}
          FH_PUSH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'reminders' }}
        run: node scripts/push-sender.mjs
