name: Push reminders

# Отправитель редких важных напоминаний (ЭТАП 3, решение владельца 2026-10-01):
# живёт в ПУБЛИЧНОМ репозитории — платные минуты приватного хранилища не тратятся.
# Раз в 5 минут (0.6.0): ступени сроков, сработавшие сегодня (Europe/Moscow), уходят
# Web Push на подписки устройств; каждое напоминание — один раз (маркеры push-sent).
# Ручной Run workflow по умолчанию делает ОБЫЧНЫЙ цикл (сроки, дела, дайджест покупок):
# именно это нужно владельцу для проверки «почему не пришло уведомление». Режим
# «test» — отдельное проверочное сообщение без сроков и маркеров; выбирается явно.
on:
  schedule:
    # 0.6.0: каждые 5 минут — минимальный разрешённый интервал GitHub. Замер 03–05.10.2026
    # показал, что при `*/30` цикл фактически запускался 4–6 раз в СУТКИ, поэтому «точное
    # время» недостижимо: чем чаще просим, тем больше шансов попасть в нужный час.
    # Дубли исключены маркерами (напоминание уходит один раз), дайджест покупок сам
    # держит паузу 30 минут, в публичном репозитории минуты Actions бесплатны.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'reminders — обычный цикл (напоминания, дела, дайджест), test — только проверочный push'
        type: choice
        options:
          - reminders
          - test
        default: reminders

concurrency:
  group: push-sender
  cancel-in-progress: false

# Оба job'а пишут в этот же публичный репозиторий встроенным токеном (GITHUB_TOKEN):
# лента — файлы в ветку `feed`, напоминания — маркеры в приватном хранилище (им нужен
# секрет FAMILY_REPO_TOKEN). Отдельных секретов и прав владельца не требуется. Пуш
# сделан GITHUB_TOKEN, поэтому другие workflow (CI, Pages) на него не запускаются.
permissions:
  contents: write

jobs:
  # Лента (подписка на календарь) — отдельный job БЕЗ установки зависимостей.
  # Зачем отдельно (0.6.9): событие, добавленное на телефоне, должно попасть в
  # календарь максимально быстро. Раньше ленту публиковал цикл отправки, и до её
  # первой строки проходил `npm ci` (~минута) ради web-push, который ленте не нужен.
  # Теперь публикация стартует сразу после checkout и длится секунды. Напоминания
  # (job `send`) от этого не зависят: у них свои права и свои зависимости.
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Лента в календарь — сразу, без установки зависимостей
        env:
          FAMILY_REPO_TOKEN: ${{ secrets.FAMILY_REPO_TOKEN }}
          PUBLIC_REPO_TOKEN: ${{ github.token }}
        run: node scripts/feed-publish.mjs

  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Лента публикуется отдельным job `feed` — здесь остались только напоминания.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Напоминания по расписанию или ручная проверка push
        env:
          FAMILY_REPO_TOKEN: ${{ secrets.FAMILY_REPO_TOKEN }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUBLIC_REPO_TOKEN: ${{ github.token }}
          FH_PUSH_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'reminders' }}
        run: node scripts/push-sender.mjs
