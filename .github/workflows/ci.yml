# Тонкий workflow (Universal Guide §6.1): инфраструктура минимальна, весь изменяемый
# код живёт обычными файлами. Запускается пушем, а не человеком.
#
# Порядок шагов: сборка стоит ДО тестов и выполняется ТОЧНО той же командой, что и в
# deploy-preview.yml (BASE_PATH передаётся инлайн, а не через `env:` шага).
# 2026-10-01 на runner'е GitHub `vite build` в этом файле не создавал dist/, тогда как в
# deploy-preview.yml сборка того же коммита (992de2a) прошла успешно и собрала артефакт.
# Перестановка шагов относительно тестов причину не устранила (проверено на 71b357f),
# поэтому следующим подозрением стала именно форма передачи переменной окружения.
# Логи Actions из среды разработки не скачиваются (*.actions.githubusercontent.com и
# *.blob.core.windows.net недоступны), поэтому причина устанавливается перебором
# отличий — вопрос Q11 в HANDOFF.md.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Versions in sync (version.json is the single source)
        run: npm run verify:version

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b --pretty false

      # Сборка — до тестов (см. комментарий в шапке файла).
      - name: Build (vite)
        id: vitebuild
        run: |
          set -o pipefail
          BASE_PATH=/FAMILY-HUB/ npx vite build 2>&1 | tee /tmp/ci-vite-build.log
          ls -la dist 2>&1 || echo "dist/ не создан"
        continue-on-error: true

      - name: Build diagnostics
        if: always()
        run: |
          echo "vite build outcome = ${{ steps.vitebuild.outcome }}"
          echo "node = $(node -v), npm = $(npm -v)"
          if [ -s dist/index.html ]; then
            echo "dist/index.html = OK"
          else
            echo "dist/index.html = ОТСУТСТВУЕТ"
            echo "--- последние 60 строк лога сборки ---"
            tail -n 60 /tmp/ci-vite-build.log || true
            touch /tmp/build-empty
          fi

      - name: Test
        run: npm run test

      - name: Artifact must be non-empty (Definition of Done, §10)
        run: |
          if [ ! -s dist/index.html ]; then
            echo "::error::Сборка не создала dist/. Текст ошибки — в шаге 'Build diagnostics' этого же запуска (логи из среды разработки не читаются, поэтому дублируем сюда)."
            exit 1
          fi
          test -s dist/index.html
          test -s dist/sw.js
          test -s dist/manifest.webmanifest
          test -s dist/app-shell.json
          echo "dist size:"; du -sh dist
