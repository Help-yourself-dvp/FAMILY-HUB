# Тонкий workflow (Universal Guide §6.1): инфраструктура минимальна, весь изменяемый
# код живёт обычными файлами. Запускается пушем, а не человеком.
#
# Порядок шагов необычный и это осознанно: сборка стоит ДО тестов.
# 2026-10-01 на runner'е GitHub `vite build` не создавал dist/, если перед ним в том же
# job'е прогонялись тесты (vitest + jsdom), тогда как в deploy-preview.yml — где тестов
# нет — сборка того же коммита проходила успешно. Логи Actions из среды разработки не
# скачиваются (недоступны *.actions.githubusercontent.com и *.blob.core.windows.net),
# поэтому причина проверяется перестановкой шагов (вопрос Q11 в HANDOFF.md).
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Versions in sync (version.json is the single source)
        run: npm run verify:version

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b --pretty false

      # Сборка — до тестов (см. комментарий в шапке файла).
      - name: Build (vite)
        id: vitebuild
        run: |
          set -o pipefail
          BASE_PATH=/FAMILY-HUB/ npx vite build 2>&1 | tee /tmp/ci-vite-build.log
        continue-on-error: true

      - name: Build diagnostics
        if: always()
        run: |
          echo "vite build outcome = ${{ steps.vitebuild.outcome }}"
          echo "node = $(node -v), npm = $(npm -v)"
          if [ -s dist/index.html ]; then
            echo "dist/index.html = OK"
          else
            echo "dist/index.html = ОТСУТСТВУЕТ"
            echo "--- последние 60 строк лога сборки ---"
            tail -n 60 /tmp/ci-vite-build.log || true
            touch /tmp/build-empty
          fi

      - name: Test
        run: npm run test

      - name: Artifact must be non-empty (Definition of Done, §10)
        run: |
          if [ -e /tmp/build-empty ]; then
            echo "Сборка не дала артефакта. Текст ошибки — в шаге 'Build diagnostics' выше."
            exit 1
          fi
          test -s dist/index.html
          test -s dist/sw.js
          test -s dist/manifest.webmanifest
          test -s dist/app-shell.json
          echo "dist size:"; du -sh dist
