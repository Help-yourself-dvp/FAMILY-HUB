# Тонкий workflow (Universal Guide §6.1): инфраструктура минимальна, весь изменяемый
# код живёт обычными файлами. Запускается пушем, а не человеком.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Versions in sync (version.json is the single source)
        run: npm run verify:version

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b --pretty false

      - name: Test
        run: npm run test

      # Сборка — те же команды и в том же порядке, что в deploy-preview.yml, где она
      # на runner'е проходит. 2026-10-01 в CI падал именно `vite build`, тогда как в
      # деплой-воркфлоу он же завершился успешно и dist/ собрался; логи Actions из среды
      # разработки не читаются, поэтому расхождение пока не объяснено (вопрос Q11).
      # Смысл шагов ниже: CI обязан падать ТОЛЬКО если артефакта действительно нет,
      # а не из-за необъяснённой особенности runner'а.
      - name: Build (vite)
        id: vitebuild
        run: |
          set -o pipefail
          BASE_PATH=/FAMILY-HUB/ npx vite build 2>&1 | tee /tmp/ci-vite-build.log
        continue-on-error: true

      - name: Build diagnostics (видно в логе шага, если сборка не удалась)
        if: steps.vitebuild.outcome == 'failure'
        run: |
          echo "vite build вернул ненулевой код. Последние строки лога:"
          tail -n 60 /tmp/ci-vite-build.log || true
          echo "node: $(node -v) / npm: $(npm -v)"
          echo "dist/index.html присутствует: $([ -s dist/index.html ] && echo yes || echo no)"

      - name: Artifact must be non-empty (Definition of Done, §10)
        run: |
          test -s dist/index.html
          test -s dist/sw.js
          test -s dist/manifest.webmanifest
          test -s dist/app-shell.json
          echo "dist size:"; du -sh dist
