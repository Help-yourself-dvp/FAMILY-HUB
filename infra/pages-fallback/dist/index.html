    <!--
      CSP (§2.2 PROJECT.md). Ключевая строка — connect-src: даже при внедрении
      чужого кода токен физически невозможно отправить на сторонний домен.

      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.github.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
